<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment - Food Delivery</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.home') }}">
                🍴 Food Delivery
            </a>
        </div>
    </nav>

    <!-- Payment Section -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h2 class="mb-3">
                            💳 Complete Payment
                        </h2>

                        <p class="text-muted">
                            Secure payment powered by Razorpay
                        </p>

                        <hr>

                        <h4 class="mb-4">
                            Amount: ₹{{ amount }}
                        </h4>

                        <button
                            id="pay-button"
                            type="button"
                            class="btn btn-success btn-lg w-100"
                        >
                            Pay ₹{{ amount }}
                        </button>

                        <a
                            href="{{ url_for('main.cart') }}"
                            class="btn btn-outline-secondary w-100 mt-2"
                        >
                            Back to Cart
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Razorpay Checkout Library -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>


    <!-- Payment JavaScript -->
    <script>

        window.addEventListener("load", function () {

            console.log("Payment page loaded");

            const payButton = document.getElementById("pay-button");

            if (!payButton) {
                console.error("Pay button not found!");
                return;
            }

            console.log("Pay button found");


            payButton.addEventListener("click", function () {

                console.log("Pay button clicked");


                const options = {

                    key: "{{ razorpay_key }}",

                    amount: {{ razorpay_order.amount }},

                    currency: "INR",

                    name: "Food Delivery",

                    description: "Food Delivery Order",

                    order_id: "{{ razorpay_order.id }}",


                    handler: function (response) {

                        console.log("Payment successful");

                        window.location.href =
                            "{{ url_for('main.payment_success') }}" +
                            "?payment_id=" +
                            encodeURIComponent(response.razorpay_payment_id) +
                            "&order_id=" +
                            encodeURIComponent(response.razorpay_order_id) +
                            "&razorpay_signature=" +
                            encodeURIComponent(response.razorpay_signature);

                    },


                    prefill: {

                        name: "{{ current_user.name }}",

                        email: "{{ current_user.email }}",

                        contact: "{{ current_user.phone }}"

                    },


                    theme: {

                        color: "#198754"

                    }

                };


                console.log("Razorpay options created");


                try {

                    const razorpay = new Razorpay(options);

                    console.log("Razorpay object created");

                    razorpay.open();

                    console.log("Razorpay checkout opened");

                }

                catch (error) {

                    console.error("Razorpay error:", error);

                    alert(
                        "Unable to open Razorpay. Please check the browser console."
                    );

                }

            });

        });

    </script>

</body>
</html>
